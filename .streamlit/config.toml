[theme]
# Fondo oscuro "Slate 900"
backgroundColor = "#0f172a"

# Fondo secundario "Slate 800" para la barra lateral
secondaryBackgroundColor = "#1e293b"

# Texto claro "Slate 50"
textColor = "#f8fafc"

# Color de acento "Indigo 500" para botones y enfoques
primaryColor = "#6366f1"

# Fuente limpia y moderna
font = "sans serif"

[client]
# Ocultar barra de herramientas por defecto
toolbarMode = "minimal"
